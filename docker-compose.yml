services:
  kathal:
    build: .
    container_name: kathal
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - kathal-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - KATHAL_DATA_DIR=/data
      - KATHAL_APPS_DIR=/data/apps

volumes:
  kathal-data:
